<style>

    align-items: center;
    min-height: 100vh;
    padding: 12px;
  }

  .flashcard-container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header-title {
    text-align: center;
    margin-bottom: 10px;
  }

  .header-title h1 {

    color: #0f172a;
  }

  .header-title p {
    font-size: 0.8rem;

  .progress-bar-container {

  }

  }

    color: #475569;
    margin-bottom: 12px;

    height: 390px; 
    perspective: 1000px;
    margin-bottom: 16px;
  }

    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
    cursor: pointer;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);

  .card.is-flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 1px solid #e2e8f0;
  }

  .card-front {
    background: #ffffff;
    color: #0f172a;
  }

  .badge {
    align-self: flex-start;
    background: #eff6ff;
    color: #2563eb;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    border: 1px solid #bfdbfe;
  }

  .front-content {
    text-align: center;
    margin: auto 0;
  }

  .term-title {
    font-size: 1.35rem;
    font-weight: 700;
    color: #1e3a8a;
    line-height: 1.35;
    word-break: break-word;
  }

  .tap-hint {
    font-size: 0.75rem;
    color: #94a3b8;
    margin-top: 12px;
  }

  .card-back {

    color: #334155;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
    padding: 5px 0;
  }

  .back-text {
    font-size: 0.95rem;
    line-height: 1.55;
    text-align: center;
    color: #334155;
  }

  .back-text strong {
    color: #1d4ed8;
    font-weight: 700;
    background-color: #eff6ff;
    padding: 2px 5px;
    border-radius: 4px;
    display: inline-block;
    margin: 1px 0;
  }

  .technical-footer {
    border-top: 1px dashed #cbd5e1;
    padding: 8px 10px;
    margin-top: 8px;
    text-align: left;
    background-color: #f8fafc;
    border-radius: 10px;
  }

  .tech-label {
    font-size: 0.7rem;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
  }

  .tech-val {
    font-size: 0.8rem;
    font-weight: 600;
    color: #0f172a;
    margin-top: 2px;
    line-height: 1.4;
  }

  .controls {

    gap: 10px;
    width: 100%;
  }

  .btn {

    border: none;
    background-color: #ffffff;
    color: #334155;
    font-weight: 700;
    font-size: 1rem;
    border-radius: 12px;

  .btn-nav {
    flex: 1;
    background-color: #f1f5f9;
  }

  .btn-flip {
    flex: 2;
    background-color: #2563eb;
    color: white;
    border: none;
  }

  .btn:active {
    transform: scale(0.96);
  }
</style>

  ];

  let currentIndex = 0;

  function updateCard() {
    const cardElement = document.getElementById('flashcard');
    const frontTerm = document.getElementById('frontTerm');
    const backDefinition = document.getElementById('backDefinition');
    const techTerm = document.getElementById('techTerm');
    const cardCategory = document.getElementById('cardCategory');
    const cardCounter = document.getElementById('cardCounter');
    const progressBar = document.getElementById('progressBar');

    if (!cardElement) return;

    cardElement.classList.remove('is-flipped');
    setTimeout(() => {
      const data = cardsData[currentIndex];
      frontTerm.textContent = data.term;
      backDefinition.innerHTML = data.back.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      techTerm.textContent = data.tech;
      cardCategory.textContent = data.category;
      
      cardCounter.textContent = `Card ${currentIndex + 1} / ${cardsData.length}`;
      const progressPercent = ((currentIndex + 1) / cardsData.length) * 100;
      progressBar.style.width = `${progressPercent}%`;
    }, 150);
  }

  function flipCard() {
    const cardElement = document.getElementById('flashcard');
    if (cardElement) cardElement.classList.toggle('is-flipped');
  }

  function nextCard() {
    currentIndex = (currentIndex < cardsData.length - 1) ? currentIndex + 1 : 0;
    updateCard();
  }

  function prevCard() {
    currentIndex = (currentIndex > 0) ? currentIndex - 1 : cardsData.length - 1;
    updateCard();
  }

  let touchstartX = 0;
  let touchendX = 0;

  const sceneElement = document.querySelector('.scene');
  if (sceneElement) {
    sceneElement.addEventListener('touchstart', e => {
      touchstartX = e.changedTouches[0].screenX;
    }, {passive: true});

    sceneElement.addEventListener('touchend', e => {
      touchendX = e.changedTouches[0].screenX;
      handleSwipe();
    }, {passive: true});
  }

  function handleSwipe() {
    const swipeThreshold = 50;
    if (touchendX < touchstartX - swipeThreshold) nextCard();
    if (touchendX > touchstartX + swipeThreshold) prevCard();
  }

  document.addEventListener('DOMContentLoaded', updateCard);
  updateCard();
</script>
